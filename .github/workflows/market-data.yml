name: Daily market data

on:
  schedule:
    - cron: "17 10 * * *" # ~5:17am Central
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r pipeline/requirements.txt

      - name: Scrape and analyze
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FBI_CDE_API_KEY: ${{ secrets.FBI_CDE_API_KEY }}
        run: python pipeline/run.py

      - name: Commit updated data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add data/ index.html market.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Daily market data $(date -u +%F) [skip ci]"
          # master may have moved during the long scrape; replay our data
          # commit on top (ours wins conflicts — the data is freshly generated)
          git pull --rebase -X theirs origin master
          git push
